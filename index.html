<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merged Human Only Animation</title>
<style>
    body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f0f2f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        gap: 40px; 
    }
    .badge-container {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        overflow: hidden;
        white-space: nowrap;
        border-radius: 50px;
        font-weight: 700;
        font-size: 18px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        cursor: pointer; 
        user-select: none;
    }


    .badge-icon {
        font-size: 20px;
        display: inline-block;
        transition: transform 0.3s ease;
    }


    .badge-text-wrapper {
        max-width: 200px;
        opacity: 1;
        padding-left: 8px;
        transition: all 0.5s ease-in-out;
    }


    .style-initial {
        background-color: #1a1a1a;
        color: #ffffff;
        padding: 12px 24px;
    }


    .badge-container.collapsed {
        padding: 12px;
    }

    .badge-container.collapsed .badge-text-wrapper {
        max-width: 0;
        opacity: 0;
        padding-left: 0;
    }


    .style-final {
        background-color: #2ea44f;
        color: white;
        padding: 12px 24px;
    }
</style>
</head>
<body>

    <div id="badge-cn" class="badge-container style-initial">
        <span id="icon-cn" class="badge-icon">×</span>
        <span id="text-cn" class="badge-text-wrapper">没有 AI</span>
    </div>

    <div id="badge-en" class="badge-container style-initial">
        <span id="icon-en" class="badge-icon">×</span>
        <span id="text-en" class="badge-text-wrapper">NO AI</span>
    </div>

<script>

    function initBadge(containerId, iconId, textId, config) {
        const badge = document.getElementById(containerId);
        const iconSpan = document.getElementById(iconId);
        const textWrap = document.getElementById(textId);
        function runAnimation() {
            badge.classList.add('collapsed');
            setTimeout(() => {
                iconSpan.textContent = '✔';
                textWrap.textContent = config.endText;
                badge.classList.remove('style-initial');
                badge.classList.add('style-final');
                badge.classList.remove('collapsed');
            }, 600);
        }
        setTimeout(runAnimation, 2000);
        badge.addEventListener('click', () => {
            if (badge.classList.contains('style-final')) {
                badge.classList.remove('style-final');
                badge.classList.add('style-initial');
                badge.classList.remove('collapsed'); 
                iconSpan.textContent = '×';
                textWrap.textContent = config.startText;
                setTimeout(runAnimation, 500);
            }
        });
    }
    initBadge('badge-cn', 'icon-cn', 'text-cn', {
        startText: '没有 AI',
        endText: '仅由人类创作'
    });
    initBadge('badge-en', 'icon-en', 'text-en', {
        startText: 'NO AI',
        endText: 'Human Only'
    });

</script>

</body>
</html>
